[package]
name = "overlook"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "overlook"
path = "src/main.rs"


[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.4.0-preview3"
pulldown-cmark = "0.12"
tokio = { version = "1.0", features = ["full"] }
poll-promise = "0.3"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"
pdf-extract = "0.7"
mime_guess = "2.0"
rfd = "0.14"
futures-util = "0.3"
tokio-stream = "0.1"
tokio-retry = "0.3"
eventsource-stream = "0.2"
bytes = "1.0"
keyring = "2.0"
rand = "0.8"
ring = "0.17"
zeroize = "1.7"
tiktoken-rs = "0.5"
dotenvy = "0.15"
open = "5.0"
smol = "2.0"
syntect = "5.2"
sha2 = "0.10"
hex = "0.4"
hostname = "0.4"
whoami = "1.5"
rmcp = { version = "0.12", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "base64", "macros", "server"] }
