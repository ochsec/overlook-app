[package]
name = "overlook"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "overlook"
path = "src/main.rs"

[[bin]]
name = "test_pdf"
path = "src/bin/test_pdf.rs"

[dependencies]
eframe = "0.28.1"
egui = "0.28.1"
tokio = { version = "1.0", features = ["full"] }
poll-promise = "0.3"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"
pdf-extract = "0.7"
mime_guess = "2.0"
rfd = "0.14"
futures-util = "0.3"
tokio-stream = "0.1"
eventsource-stream = "0.2"
bytes = "1.0"
